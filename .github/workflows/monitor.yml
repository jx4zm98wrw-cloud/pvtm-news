name: pvtm news monitor

# Triggered ONLY by an EXTERNAL cron (cron-job.org) calling workflow_dispatch
# every 30 min. GitHub's own `schedule` was best-effort and dropped most ticks
# under load (observed gaps up to ~3h), so it was removed. Manual runs from the
# Actions tab also use workflow_dispatch.
#   External call: POST /repos/<owner>/<repo>/actions/workflows/monitor.yml/dispatches
#   body {"ref":"main"}  — see README "Deploy".
#   TRADE-OFF: with no `schedule` fallback, if the external cron ever stops,
#   nothing triggers this workflow. Re-add a `schedule:` block to restore a net.
on:
  workflow_dispatch: {}   # external cron (primary) + manual runs from the Actions tab

# Don't let overlapping runs (e.g. a manual run during a cron dispatch) clash over the state cache.
concurrency:
  group: pvtm-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # Restore seen.json from the previous run, and save the updated one after.
      # The unique per-run key never hits exactly, so the post-job save always
      # writes; restore-keys loads the most recent prior cache.
      - uses: actions/cache@v6
        with:
          path: seen.json
          key: pvtm-seen-${{ github.run_id }}
          restore-keys: |
            pvtm-seen-

      # Isolated cache for the IP-gazette state — namespace 'ipvn-seen-' must NOT
      # collide with 'pvtm-seen-' or the two feeds would restore each other's state.
      - uses: actions/cache@v6
        with:
          path: seen-ipvn.json
          key: ipvn-seen-${{ github.run_id }}
          restore-keys: |
            ipvn-seen-

      - name: Run monitor
        run: node monitor.mjs --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_BOT_TOKEN_3: ${{ secrets.TELEGRAM_BOT_TOKEN_3 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_BCC: ${{ secrets.MAIL_BCC }}

      # IP-gazette feed — continue-on-error so a failure here NEVER turns the job
      # red (which would suppress the liveness ping and fire a FALSE dead-man's
      # alert). Its own structure guard handles genuine IP-feed breakage (#1/#4).
      - name: Run IP gazette monitor
        continue-on-error: true
        run: node monitor-ipvn.mjs --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_IPVN: ${{ secrets.TELEGRAM_CHAT_ID_IPVN }}

      # Dead-man's-switch: ping an external monitor (e.g. healthchecks.io) after a
      # successful run. If runs ever stop — external cron dies, workflow breaks —
      # the monitor stops being pinged and alerts YOU that monitoring went silent.
      # Best-effort and optional: no-op if HEALTHCHECK_URL secret isn't set, and a
      # failed ping never fails the job (the missing ping is itself the signal).
      - name: Liveness ping (dead-man's-switch)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HC_URL" && echo "liveness pinged" || echo "liveness ping failed (non-fatal)"
          else
            echo "HEALTHCHECK_URL not set — skipping liveness ping"
          fi
